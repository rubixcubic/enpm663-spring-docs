  <title
     id="title1">The shared tester area</title>
  <desc
     id="desc1">A top view of the ARIAC Task 1 inspection area, drawn to scale, x to the right and y up, with a 0.5 m scale bar. Tag 1: the inspection conveyor on the left, with an arrow showing cells moving to the right. Tag 2: the inspection door across the conveyor. Tag 3: inspection robot 1, a UR3e, below the end of the conveyor. Tags 4 and 5: voltage testers 1 and 2, one above the other (tester 1 higher), to the right of robot 1. Tag 6: inspection robot 2, a UR5e, to the right of the testers. Tag 7: the recycling bin below robot 2. Tag 8: AGVs 1 to 3 in a row above robot 2. A dashed circle around each robot shows its reach, 0.5 m and 0.85 m. The two circles overlap in a shaded yellow area that holds both testers.</desc>
