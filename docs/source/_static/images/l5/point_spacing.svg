  <title
     id="title1">Lidar point spacing</title>
  <desc
     id="desc1">Top view, to scale. A green triangle on the left (tag 1), the lidar, points right at a gray circle 0.1 m away (tag 5), the cell. Seven rays fan out from the lidar, 0.064 rad apart; three of them end on the near side of the cell with a black dot, the others pass by as dashed lines. Tag 2 marks a small arc between two neighboring rays: the angular step. Tag 3 marks a short line with end ticks between two neighboring dots: the spacing on the cell, about 6 mm. Tag 4 marks a two-headed arrow from the lidar to the cell's axis: the distance.</desc>
