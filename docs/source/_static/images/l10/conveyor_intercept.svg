  <title
     id="title1">Conveyor catch</title>
  <desc
     id="desc1">The inspection conveyor seen from above, moving to the right (arrow), along world x. A break beam, tag 1, crosses the belt at x = 0.6 m. A gripper, tag 2, waits at x = 1.4 m with two open fingers pointing upstream, one on each side of the belt's center. Red circles show one cell: faded at 0.6 m (t = 0 s) and 0.8 m (t = 2.0 s), solid between the fingers at 1.4 m (t = 8.0 s), tag 3. A hollow red circle at 1.2 m (t = 6.0 s) is tag 4. Below, a world x axis from 0.6 to 1.4 m.</desc>
