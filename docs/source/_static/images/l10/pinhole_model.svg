  <title
     id="title1">Pinhole camera model</title>
  <desc
     id="desc1">A pinhole camera seen from above. Tag 1 marks the camera center, where the optical frame starts: z points right along the optical axis, x points down the page, and y points into the page. Tag 2 is the image plane, a distance f in front of the center. A dashed ray runs from the center to a point, tag 3, at depth Z and sideways offset X. The ray crosses the image plane at tag 4, a distance u minus c x from the axis.</desc>
