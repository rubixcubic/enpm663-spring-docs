  <title
     id="title1">Camera ray to the table</title>
  <desc
     id="desc1">A side view of a camera 1.0 m above the assembly table, looking straight down. A dashed line drops from the camera to the table; a solid ray goes from the camera to a red point on the table, tag 4, 0.10 m to the right of the dashed line. Three sets of axes are drawn on the left. Tag 1, the world: z up, y left, x into the page. Tag 2, the camera link frame: x down, y left, z into the page. Tag 3, the optical frame: z down, x right, y out of the page.</desc>
